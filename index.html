function zip(fs){const P=[],C=[],en8=new TextEncoder();let o=0;for(const f of fs){const n=en8.encode(f.n),c=crc(f.d),l=f.d.length,h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,l,true);h.setUint32(22,l,true);h.setUint16(26,n.length,true);P.push(h.buffer,n,f.d);
