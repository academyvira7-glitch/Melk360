:root[data-skin="purple"]{--bg:#EDF4FC;--card:#FFFFFF;--ink:#2A2340;--mut:#605A7C;--line:#DAE3F2;--soft:#EBF1FA;--pri:#7A3FD9;--pris:#EBDFFF;--onpri:#FFFFFF;--hero1:#7A3FD9;--hero2:#2878A8;--shadow:0 8px 24px rgba(90,70,160,.10);--hbg:linear-gradient(90deg,#C58BF7,#8FD6EE);--hink:#1F1838;--hsub:#1F1838;--hbtn:rgba(255,255,255,.6);--hon:#FFFFFF;--honc:#7A3FD9;--hsh:0 10px 28px rgba(122,63,217,.16);--hrad:0 0 28px 28px;--nbg:#FFFFFF;--nink:#605A7C;--nact:#7A3FD9;--nabg:#EBDFFF;--nsh:0 -8px 24px rgba(90,70,160,.10);--nrad:26px 26px 0 0;--tile:#F3EEFF;--tico:#2A2340;--tlab:#2A2340;--tsh:0 6px 16px rgba(122,63,217,.12);--tonbg:#7A3FD9;--tonc:#FFFFFF;--icof:#9BD8F0;--acc:#4DB5E0;--accd:#17709A;--crad:26px}
:root[data-skin="sage"]{--bg:#FBFBF8;--card:#FFFFFF;--ink:#1E241B;--mut:#55614D;--line:#E8E6DA;--soft:#FFF8E6;--pri:#3A7035;--pris:#DCEFD0;--onpri:#FFFFFF;--hero1:#2F5E2B;--hero2:#3F7A3A;--shadow:0 6px 18px rgba(70,100,50,.10);--hbg:#C8E3B8;--hink:#1A2316;--hsub:#2F3D29;--hbtn:rgba(255,255,255,.55);--hon:#3B3B3B;--honc:#FFFFFF;--hsh:0 8px 22px rgba(80,110,60,.14);--hrad:0 0 28px 28px;--nbg:#C8E3B8;--nink:#3B4A34;--nact:#1E241B;--nabg:rgba(255,255,255,.6);--nsh:0 -6px 18px rgba(80,110,60,.12);--nrad:24px 24px 0 0;--tile:#C8E3B8;--tico:#1E241B;--tlab:#1E241B;--tsh:0 4px 12px rgba(80,110,60,.12);--tonbg:#FFA45B;--tonc:#1E241B;--icof:#FFA45B;--acc:#E07A1F;--accd:#A8540F;--crad:24px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;min-height:100%;direction:rtl}
body::before{content:"";position:fixed;top:0;left:0;right:0;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--hbg)}
button{font:inherit;color:inherit;cursor:pointer}
.w{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--hbg);box-shadow:var(--hsh);border-radius:var(--hrad)}
.top .w{display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.ttl{flex:1;min-width:0}
.brand{font-size:11px;letter-spacing:3px;color:var(--pri);font-weight:800}
.ttl h1{margin:0;font-size:19px;font-weight:800;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--hink)}
.ttl .sub{font-size:12px;color:var(--hsub)}
.sv{font-size:11px;color:var(--hsub);min-height:18px;display:flex;align-items:center;gap:4px}
.sv i{width:8px;height:8px;border-radius:50%;background:var(--hsub);border:1px solid rgba(255,255,255,.85);display:inline-block}
.sv.ok i{background:var(--r5)}.sv.bad i{background:var(--r1)}.sv.wait i{background:var(--r3)}
#clock{width:54px;height:54px;flex:none;color:var(--ink);filter:drop-shadow(0 4px 10px rgba(16,38,43,.12))}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nbg);box-shadow:var(--nsh);border-radius:var(--nrad);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .w{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding-block:8px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:16px;color:var(--nink);font-size:12.5px;font-weight:700}
.tabs button.on{background:var(--nabg);color:var(--nact)}
main.w{padding-block:4px 120px}
/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--crad);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.rows>.card+.card{margin-top:0}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:24px 2px 10px}
.sec h2{font-size:16px;margin:0;font-weight:800}
.sec small{color:var(--mut);font-size:12px}
.lb{display:block;font-size:12px;color:var(--mut);margin:12px 2px 6px;font-weight:600}
.hint{font-size:12px;color:var(--mut);margin:2px 0 10px}
.in{width:100%;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:14px;padding:10px 13px;font:inherit;font-size:16px;outline:none;resize:vertical}
.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
textarea.in{min-height:48px}
.stack{display:grid;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;background:var(--pri);color:var(--onpri);border-radius:14px;padding:11px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:color-mix(in srgb,var(--r1) 14%,var(--card));color:color-mix(in srgb,var(--r1) 70%,var(--ink));border:1px solid color-mix(in srgb,var(--r1) 40%,var(--line))}
.btn.arm{background:var(--r1);color:var(--onr1);border-color:var(--r1)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:12px}
.btn.full{width:100%}
.ib{border:0;background:none;color:var(--mut);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ib:active,.ib.arm{background:var(--soft);color:var(--r1)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--pris);color:var(--pri)}
.pill.g{background:color-mix(in srgb,var(--r5) 16%,var(--card));color:color-mix(in srgb,var(--r5) 45%,var(--ink))}
.pill.o{background:color-mix(in srgb,var(--r2) 16%,var(--card));color:color-mix(in srgb,var(--r2) 45%,var(--ink))}
.pill.m{background:var(--soft);color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:22px 12px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.bar.sm{height:6px}
/* hero */
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border:0;padding:18px}
.hero .row{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring b{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800}
.hero h3{margin:0;font-size:19px;font-weight:800}
.hero p{margin:2px 0 0;font-size:13px;opacity:.9}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.mini div{background:rgba(255,255,255,.16);border-radius:14px;padding:8px 6px;text-align:center;font-size:11px}
.mini b{display:block;font-size:17px;line-height:1.4}
.hero .btn{background:rgba(255,255,255,.2);color:#fff;margin-top:12px}
.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--pris);border:1px solid color-mix(in srgb,var(--pri) 35%,var(--line));border-radius:18px;padding:12px 14px;margin-top:12px;font-size:13px}
/* steps / rows */
.rows{display:grid;gap:8px}
.row-b{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.row-b.on{border-color:color-mix(in srgb,var(--r5) 55%,var(--line));background:color-mix(in srgb,var(--r5) 9%,var(--card))}
.cb{width:24px;height:24px;border-radius:8px;border:1.8px solid var(--mut);display:grid;place-items:center;flex:none;color:transparent;background:none;padding:0}
.on>.cb,.cb.on{background:var(--r5);border-color:var(--r5);color:#062218}
.row-b .rt{flex:1;min-width:0;font-size:14px}
.row-b.on .rt{color:var(--mut);text-decoration:line-through}
.row-b .em{font-size:18px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qb{text-align:right;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:92px}
.qb.on{border-color:var(--pri);background:var(--pris)}
.qb b{display:block;font-size:14px}.qb span{font-size:22px}.qb small{display:block;color:var(--mut);font-size:11px;line-height:1.6;margin-top:2px}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rate button{border:2px solid transparent;border-radius:16px;background:var(--soft);padding:8px 2px;font-size:11px;color:var(--mut);display:grid;gap:2px;justify-items:center}
.rate button span{font-size:24px;line-height:1.2}
.rate button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card));color:var(--ink);font-weight:700}
/* plan */
.nav{display:flex;align-items:center;gap:8px}
.nav .t{flex:1;text-align:center;font-weight:800}
.nav .t small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.nb{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.tile b{display:block;font-size:20px;line-height:1.5;font-weight:800}
.tile small{color:var(--mut);font-size:11px}
.blk{display:flex;align-items:stretch;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;position:relative}
.blk::before{content:"";width:4px;border-radius:4px;background:var(--c,var(--mut));flex:none}
.blk.now{border-color:var(--pri);box-shadow:0 0 0 2px color-mix(in srgb,var(--pri) 25%,transparent)}
.blk.dn .bt{text-decoration:line-through;color:var(--mut)}
.blk .bb{flex:1;min-width:0;border:0;background:none;text-align:right;padding:0}
.blk .tm{font-size:12px;color:var(--mut)}
.blk .bt{font-size:14.5px;font-weight:600}
.blk .ck{align-self:center}
.tk{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 4px}
.tk .cb{margin-inline:8px 4px}
.tk .tt{flex:1;min-width:0;font-size:14px}
.tk.dn .tt{text-decoration:line-through;color:var(--mut)}
.tk.mv .tt{color:var(--mut);font-size:13px}
.tk.cl{background:var(--soft)}
.tk.cl .tt{color:var(--mut);font-size:13px}
.tk .why{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:12px;color:var(--mut)}
.tk.mv{padding:9px 12px}
.pill.n{background:color-mix(in srgb,var(--neg) 14%,var(--card));color:color-mix(in srgb,var(--neg) 80%,var(--ink))}
.rsn{display:grid;gap:8px;margin-top:6px}
.rsn button{display:flex;align-items:center;gap:10px;text-align:start;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:10px 12px;font:inherit;color:var(--ink)}
.rsn button b{display:block;font-size:14px}
.rsn button small{display:block;font-size:12px;color:var(--mut);margin-top:1px}
.rsn button>span:first-child{flex:1;min-width:0}
.rsn button.on{border-color:var(--pri);background:var(--pris)}
.rsn .pv2{flex:none;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--mut);white-space:nowrap}
.rsn .pv2.n{background:color-mix(in srgb,var(--neg) 14%,var(--card));color:color-mix(in srgb,var(--neg) 80%,var(--ink))}
.hpen{margin-top:10px;text-align:center;font-size:12px;opacity:.95}
.heat i.l5{background:var(--neg);border-color:var(--neg)}
.wk b.ng{color:var(--neg)}
.wrow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px}.wrow span{flex:1;min-width:0}
.wrow select{flex:none;width:128px}
.wkc{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}
.wkc>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mut);min-width:0}
.wkc b{font-size:11px;color:var(--ink)}
.wkc .bc{display:flex;align-items:flex-end;width:100%;max-width:28px;height:84px;background:var(--soft);border-radius:8px;overflow:hidden}
.wkc .bt{display:block;position:relative;width:100%;background:color-mix(in srgb,var(--pri) 26%,var(--card));border-radius:8px 8px 0 0}
.wkc .bd{display:block;position:absolute;left:0;right:0;bottom:0;background:var(--pri)}
.wkc .td{color:var(--pri);font-weight:800}
.wcats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wcat{display:block;width:100%;text-align:start;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:10px 12px;font:inherit;color:var(--ink)}
.wcat b{display:block;font-size:24px;line-height:1.2}
.wcat small{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--mut);margin-top:2px}
.wcat .bar{display:block;margin-top:8px;height:6px}.wcat .bar i{background:var(--c)}
.wcat.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--card))}
.tk.lg{padding:8px 8px 8px 4px}.tk.lg .tt{padding-inline-start:10px}
.wtr{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;align-items:end}
.wtr button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:6px 0 4px;border-radius:10px;font:inherit;font-size:11px;color:var(--mut);min-width:0}
.wtr button.sel{background:var(--pris)}
.wtr b{font-size:10px;color:var(--ink);white-space:nowrap}
.wtr .bc{display:flex;align-items:flex-end;width:100%;max-width:22px;height:90px;background:var(--soft);border-radius:7px;overflow:hidden}
.wtr .bc i{display:block;width:100%;background:var(--pri);border-radius:7px 7px 0 0}
.wtr em{font-style:normal;font-size:9px;white-space:nowrap}
.wtr .cn{font-size:12px;font-weight:800;color:var(--ink);border-top:1px solid var(--line);padding-top:3px;width:100%;text-align:center}
.cmp{display:grid;gap:7px;background:var(--soft);border-radius:14px;padding:10px 12px}
.cmpr{display:grid;grid-template-columns:1fr 64px 64px;gap:8px;align-items:center;font-size:13px}
.cmpr b{text-align:center;font-weight:700}
.cmpr.h{color:var(--mut);font-size:12px}
.bkl{font-size:12px;color:var(--mut);margin:10px 2px 0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0,0,0,0);pointer-events:none}
.dg{margin-top:12px;display:grid;gap:8px}
.dgr{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.7}
.dgr b{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;background:var(--mut)}
.dgr.ok b{background:var(--r5)}.dgr.bad b{background:var(--neg)}.dgr.wn b{background:var(--r3)}
.dgr span{min-width:0;overflow-wrap:anywhere}.dgr small{display:block;color:var(--mut);font-size:12px}
.addrow{display:flex;gap:8px;margin-top:10px}
/* goals */
.gsum{display:flex;gap:14px;align-items:center}
.gsum .big{font-size:34px;font-weight:800;line-height:1.2}
.goal{padding:0;overflow:hidden}
.gh{display:block;width:100%;text-align:right;border:0;background:none;padding:14px 16px}
.gh .l1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.gh .gt{font-weight:800;font-size:15.5px}
.gh .l2{display:flex;align-items:center;gap:10px;margin-top:10px}
.gh .l2 .bar{flex:1}
.gh .l2 b{font-size:15px;min-width:42px;text-align:left}
.pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.gb{padding:0 16px 16px;border-top:1px solid var(--line)}
.bd{display:grid;grid-template-columns:96px 1fr 40px;gap:8px;align-items:center;font-size:12.5px;margin-top:10px}
.bd b{text-align:left}
.sub2{font-size:12px;color:var(--mut)}
.gsec{margin-top:16px}
.gsec h4{margin:0 0 8px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.li{display:flex;align-items:center;gap:6px;padding:4px 0}
.li .cb{margin-inline:0 6px}
.li .tt{flex:1;font-size:13.5px}
.li.dn .tt{text-decoration:line-through;color:var(--mut)}
.spark{width:100%;height:84px;margin-top:8px}
/* stats */
.lvl{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border:0}
.lvl .t{display:flex;justify-content:space-between;align-items:center}
.lvl h3{margin:0;font-size:24px;font-weight:800}
.lvl small{opacity:.85}
.lvl .bar{background:rgba(255,255,255,.25);margin-top:14px}.lvl .bar i{background:#fff}
.lvl .tr{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px}
.wk div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--mut)}
.wk i{display:block;width:100%;max-width:28px;border-radius:8px 8px 4px 4px;background:var(--c);min-height:4px}
.wk b{font-size:11px;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;justify-items:center}
.cal .h{font-size:12px;color:var(--mut);padding:4px 0}
.cd{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:600;padding:0;color:var(--mut)}
.cd.hs{border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 14%,var(--card))}
.cd.r{background:var(--c);border-color:var(--c);color:var(--onr)}
.cd.r1{color:var(--onr1)}
.cd.tdy{outline:2px solid var(--pri);outline-offset:2px}
.cd.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 35%,transparent)}
.cd:disabled{opacity:.4}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mut);margin-top:12px;justify-content:center}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-inline:0 4px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{min-height:10px;aspect-ratio:1;border-radius:5px;background:var(--soft);border:1px solid var(--line);display:block}
.heat i.l1{background:var(--r1);border-color:var(--r1)}.heat i.l2{background:var(--r2);border-color:var(--r2)}.heat i.l3{background:var(--r4);border-color:var(--r4)}.heat i.l4{background:var(--r5);border-color:var(--r5)}
.hm{display:grid;gap:4px;font-size:10.5px;color:var(--mut);margin-top:6px}
.hm span{white-space:nowrap}
.hab{display:grid;grid-template-columns:1fr 44px;gap:4px 10px;align-items:center;margin-top:10px;font-size:13px}
.hab .bar{grid-column:1/-1}
.hab b{text-align:left}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bg{text-align:center;font-size:11px;color:var(--mut);line-height:1.5}
.bg .c{width:52px;height:52px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--soft);color:var(--mut);opacity:.6}
.bg.on .c{background:color-mix(in srgb,var(--r3) 22%,var(--card));color:var(--r2);opacity:1}
.bg.on{color:var(--ink);font-weight:600}
/* sheet + toast */
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:60;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet .bk{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;background:rgba(5,15,18,.55)}
.sheet .pn{position:relative;width:100%;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.pn h3{margin:0 0 4px;font-size:17px;font-weight:800}
.pn .ft{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.pn .ft .btn:first-child{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-size:13px;max-width:88%;text-align:center}
.toast[hidden]{display:none}
.sr{display:flex;gap:8px;align-items:center;margin-top:8px}
.sr .in{flex:1;min-width:0}
.sr .em{width:56px;flex:none;text-align:center;padding-inline:4px}
@media (prefers-reduced-motion:no-preference){.bar i,.wk i{transition:width .3s,height .3s}}
/* ---- v3: header with photo + gear, two tabs, accordions, reminders, lock, skins ---- */
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.18);background:var(--soft)}
.gear{width:42px;height:42px;border-radius:14px;border:0;background:var(--hbtn);display:grid;place-items:center;flex:none;color:var(--hink);padding:0}
.gear.on{background:var(--hon);color:var(--honc)}
.ac{background:var(--card);border:1px solid var(--line);border-radius:var(--crad);margin-top:12px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:110px}
.ah{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:14px 16px;text-align:right;font-weight:800;font-size:16px}
.ah .at{flex:1;min-width:0}
.ah small{color:var(--mut);font-size:12px;font-weight:500}
.ah .ic{color:var(--mut);transition:transform .2s}
.ac.open .ah .ic{transform:rotate(180deg)}
.ab{padding:2px 16px 16px}
.ab .sec{margin:20px 2px 10px}
.ab .card:not(.lvl){background:none;border:0;box-shadow:none;padding:0}
.ab .card+.card{margin-top:12px}
.ab .card.lvl{background:linear-gradient(135deg,var(--hero1),var(--hero2));padding:16px}
.ab .tile{box-shadow:none;background:var(--soft)}
.wb+.wb{margin-top:16px}
.wb>b{display:block}
.rg{font-size:12px;font-weight:700;color:var(--mut);margin:14px 2px 6px}
.rm{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 4px}
.rm .cb{margin-inline:8px 4px}
.rm .rb{flex:1;min-width:0}
.rm .rt2{font-size:14px;font-weight:600;line-height:1.5}
.rm .rd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.rm.ov{border-color:color-mix(in srgb,var(--r2) 60%,var(--line))}
.rm.nw{border-color:var(--pri)}
.two3{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px}
.two3[hidden]{display:none}
.chip.sk i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline:0 6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.btn.sm.lab{cursor:pointer}
.banner .bi{display:flex;align-items:center;gap:6px;min-width:0}
/* ---- v12: follow-up chip, undo-move chip ---- */
.tk .why .fu{white-space:nowrap}
.tk .why .fu{display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:3px 10px;border:1px solid var(--line);border-radius:99px;background:none;color:var(--mut);font:inherit;font-size:11.5px;font-weight:700;touch-action:manipulation}
.tk .why .fu i{width:11px;height:11px;border-radius:50%;border:1.5px solid currentColor}
.tk .why .fu.on{background:color-mix(in srgb,var(--r5) 16%,var(--card));border-color:var(--r5);color:var(--ink)}

function effortDone(g){return (goalProg(g,S.days).comps.find(c=>c.k==='effort')||{raw:0}).raw;}
function spark(m){
  const pts=[...(m.log||[]).map(x=>num(x.v))];
  if(pts.length<2)return '<div class="sub2" style="margin-top:6px">با ثبت مقدار فعلی، نمودار پیشرفت اینجا ساخته می‌شود.</div>';
  const lo=Math.min(...pts,num(m.start)),hi=Math.max(...pts,num(m.target)),rg=(hi-lo)||1;
  const xy=pts.map((v,i)=>[10+i*(280/(pts.length-1)),70-((v-lo)/rg)*60]);
  const ln=xy.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 300 80" role="img" aria-label="روند ${esc(m.name)}"><polygon points="10,75 ${ln} ${xy[xy.length-1][0].toFixed(1)},75" fill="var(--pri)" opacity=".14"/><polyline points="${ln}" fill="none" stroke="var(--pri)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${xy.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===xy.length-1?5:3}" fill="var(--pri)"/>`).join('')}</svg>`;
}

function missCard(s){

function bStats(){

    <div class="sub2 num" style="margin-top:6px">${fa(x.sd)} از ${fa(x.sv)} قدم · ${fa(x.td)} از ${fa(x.tn)} کار</div>
    ${x.pen>0?`<div class="sub2" style="margin-top:4px">کسر امتیاز: <bdi dir="ltr" class="num">−${fp(x.pen)}</bdi> (${missTxt(x.miss)})</div>`:''}

function clockSvg(){
  let t='';for(let i=0;i<60;i++){const a=i*Math.PI/30,big=i%5===0,r1=big?38:42;
    t+=`<line x1="${(50+Math.sin(a)*r1).toFixed(1)}" y1="${(50-Math.cos(a)*r1).toFixed(1)}" x2="${(50+Math.sin(a)*46).toFixed(1)}" y2="${(50-Math.cos(a)*46).toFixed(1)}" stroke="currentColor" stroke-width="${big?2.4:1}" opacity="${big?0.85:0.3}"/>`;}
  return `<svg id="clock" viewBox="0 0 100 100" role="img" aria-label="ساعت"><circle cx="50" cy="50" r="49" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>${t}
  <line id="hh" x1="50" y1="54" x2="50" y2="29" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
  <line id="mm" x1="50" y1="56" x2="50" y2="17" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <line id="ss" x1="50" y1="60" x2="50" y2="13" stroke="var(--r2)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="3.2" fill="var(--r2)"/></svg>`;
}
function tick(){
  const t=new Date(),s=t.getSeconds(),m=t.getMinutes()+s/60,h=(t.getHours()%12)+m/60;
  const set=(id,a)=>{const e=document.getElementById(id);if(e)e.setAttribute('transform','rotate('+a+' 50 50)');};
  set('hh',h*30);set('mm',m*6);set('ss',s*6);
  const nk=nowKey();if(nk!==TK){const wasPlan=PK===TK;TK=nk;if(wasPlan)PK=TK;autoCarry();render();updHead();}
  if(locked)updLock();
}

  aadd(el){const i=$('#na-'+el.dataset.id),t=i.value.trim();if(!t)return;gmod(el.dataset.id,g=>{g.actions.push({id:uid(),t,done:false});});},
  eadd(el){const v=num(en($('#ev-'+el.dataset.id).value)),n=$('#en-'+el.dataset.id).value.trim();if(!v){toast('مقدار تلاش را بنویس');return;}gmod(el.dataset.id,g=>{g.efforts.push({id:uid(),d:TK,v,n});});},
  edel(el){gmod(el.dataset.g,g=>{g.efforts=g.efforts.filter(x=>x.id!==el.dataset.id);});},
  mset(el){const raw=en($('#mv-'+el.dataset.id).value);if(raw===''||!isFinite(parseFloat(raw))){toast('یک عدد وارد کن');return;}const v=parseFloat(raw);gmod(el.dataset.id,g=>{g.metric.cur=v;g.metric.log=(g.metric.log||[]).filter(x=>x.d!==TK);g.metric.log.push({d:TK,v});});},
  ghab(el){el.classList.toggle('on');},
  gm(el){const on=el.classList.toggle('on');$('#'+el.dataset.t).hidden=!on;},
  gsave(){saveGoalSheet();},
  cm(el){CM+=+el.dataset.n;if(CM>12){CM=1;CY++;}if(CM<1){CM=12;CY--;}SD=null;render();},
  cday(el){SD=SD===el.dataset.day?null:el.dataset.day;render();},
  sadd(el){const w=el.dataset.w;if(w==='steps')S.cfg.steps.push({id:'s'+uid(),e:'⭐',t:'قدم تازه'});else S.cfg.qual.push({id:'q'+uid(),e:'⭐',t:'ویژگی تازه',d:'توضیح کوتاه'});saveCfg();render();},
  sdel(el){const w=el.dataset.w;S.cfg[w]=S.cfg[w].filter(x=>x.id!==el.dataset.id);saveCfg();render();},
  smove(el){const l=S.cfg[el.dataset.w],i=l.findIndex(x=>x.id===el.dataset.id);if(i>0){[l[i-1],l[i]]=[l[i],l[i-1]];saveCfg();render();}},
  bkcopy(){
    const txt=JSON.stringify({v:1,cfg:S.cfg,goals:G(),days:S.days,rem:S.rem,wk:S.wk});
    const fb=()=>{const t=$('#bk');t.value=txt;t.focus();t.select();toast('متن را کپی کن و جایی نگه دار');};
    try{navigator.clipboard.writeText(txt).then(()=>toast('پشتیبان کپی شد'),fb);}catch(e){fb();}
  },
  bkrestore(){
    try{const o=bkParse($('#bk').value);applyBackup(o);toast('پشتیبان بازیابی شد');}
    catch(e){toast('متن پشتیبان معتبر نیست');}
  },
  bkfile(){
    try{
      const blob=new Blob([JSON.stringify(bkBuild())],{type:'application/json'}),a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download=bkName('json');a.rel='noopener';document.body.appendChild(a);a.click();
      setTimeout(()=>{try{URL.revokeObjectURL(a.href);}catch(e){}a.remove();},8000);
      bkMark();toast('فایل پشتیبان ساخته شد؛ در پوشه‌ی دانلودهای گوشی است');
    }catch(e){toast('ساخت فایل ممکن نشد؛ از «کپی پشتیبان» استفاده کن');}
  },
  async bkshare(){
    const txt=JSON.stringify(bkBuild());
    try{
      let f=new File([txt],bkName('json'),{type:'application/json'});
      if(!(navigator.canShare&&navigator.canShare({files:[f]})))f=new File([txt],bkName('txt'),{type:'text/plain'});
      if(!(navigator.canShare&&navigator.canShare({files:[f]}))){toast('ارسال فایل در این مرورگر ممکن نیست؛ «دانلود فایل» را بزن');return;}
      await navigator.share({files:[f],title:'پشتیبان My Vision'});bkMark();
    }catch(e){if(!e||e.name!=='AbortError')toast('ارسال انجام نشد؛ «دانلود فایل» را بزن');}
  },
  bkgo(){if(!BKP)return;try{applyBackup(BKP.o);BKP=null;closeSheet();toast('پشتیبان بازیابی شد');}catch(e){toast('بازیابی انجام نشد');}},
  async wipe(){
    const ids=['cfg','goals','rem','wk',...Object.keys(S.days).map(k=>'d-'+k)];
    S.cfg=defCfg();S.goals=null;S.days={};S.rem=[];S.wk={};dirty.clear();
    ids.forEach(id=>{try{localStorage.removeItem(LS+id);}catch(e){}});
    applySkin();render();toast('همه‌ی داده‌ها حذف شد');
    if(dbc){for(const id of ids){try{await dbc.doc(id).delete();delete last[id];}catch(e){}}}
  },
  sclose(){closeSheet();},
  async diag(){
    const box=$('#dg');if(!box)return;
    box.innerHTML='<div class="dgr wn"><b>…</b><span>در حال بررسی…</span></div>';
    let r;try{r=await runDiag();}catch(e){r=[{k:'bad',t:'بررسی کامل نشد',h:''}];}
    const b2=$('#dg');if(!b2)return;
    b2.innerHTML=r.map(x=>`<div class="dgr ${x.k}"><b>${x.k==='ok'?'✓':x.k==='bad'?'✗':'!'}</b><span>${x.t}${x.h?`<small>${x.h}</small>`:''}</span></div>`).join('');
  },
  instl(){if(!DIP)return;const e=DIP;DIP=null;try{e.prompt();Promise.resolve(e.userChoice).then(c=>{toast(c&&c.outcome==='accepted'?'نصب شروع شد':'نصب لغو شد');}).catch(()=>{});}catch(x){toast('نصب از اینجا ممکن نشد؛ از منوی Chrome «Install app» را بزن');}render();},
  fspref(){fsPref=!fsPref;try{localStorage.setItem(LS+'fs',fsPref?'1':'0');}catch(e){}render();},
  fsnow(){if(document.fullscreenElement)fsOff();else fsOn();}
};
function gmod(id,fn){const g=G().find(x=>x.id===id);if(!g)return;fn(g);g.sample=false;saveGoals();render();}
const CH={
  bkfile(t){
    const f=t.files&&t.files[0];t.value='';if(!f)return;
    if(f.size>30e6){toast('این فایل بزرگ‌تر از یک پشتیبان است');return;}
    f.text().then(txt=>{let o;try{o=bkParse(txt);}catch(e){toast('این فایل، پشتیبان My Vision نیست');return;}BKP={o,name:f.name};showBkPrev();}).catch(()=>toast('خواندن فایل ممکن نشد'));
  },
  negw(t){const k=t.dataset.id,v=+t.value;if(['time','forgot','lazy','move'].includes(k)&&[0,.25,.5,1,1.5,2].includes(v)){S.cfg.neg[k]=v;saveCfg();render();}},
  stepE(t){const s=S.cfg.steps.find(x=>x.id===t.dataset.id);if(s){s.e=t.value.trim()||'⭐';saveCfg();}},
  stepL(t){
    const x=S.cfg.steps.find(q=>q.id===t.dataset.id);if(!x)return;
    const v=t.value;
    if(v==='')delete x.l;else if(v==='note'){if(!['line','pri','note'].includes(x.l))x.l='note';}else x.l=v;
    if(STO===x.id&&!x.l)STO=null;
    saveCfg();render();
  },
  stepT(t){const s=S.cfg.steps.find(x=>x.id===t.dataset.id);if(s){s.t=t.value.trim()||s.t;saveCfg();}},
  qE(t){const q=S.cfg.qual.find(x=>x.id===t.dataset.id);if(q){q.e=t.value.trim()||'⭐';saveCfg();}},
  qT(t){const q=S.cfg.qual.find(x=>x.id===t.dataset.id);if(q){q.t=t.value.trim()||q.t;saveCfg();}},
  qD(t){const q=S.cfg.qual.find(x=>x.id===t.dataset.id);if(q){q.d=t.value.trim();saveCfg();}},
  first(t){
    const v=t.value.trim(),tm=addDays(PK,1),td=D(tm),i=td.tasks.findIndex(x=>x.id==='first');
    if(v){if(i>=0)td.tasks[i].t=v;else td.tasks.unshift({id:'first',t:v,done:false,from:PK});toast('به کارهای فردا اضافه شد');}
    else if(i>=0&&!td.tasks[i].done)td.tasks.splice(i,1);
    touch(tm);
  },
  photo(t){
    const f=t.files&&t.files[0];if(!f)return;
    const u=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{const n=Math.min(im.naturalWidth,im.naturalHeight),c=document.createElement('canvas');c.width=c.height=192;
      c.getContext('2d').drawImage(im,(im.naturalWidth-n)/2,(im.naturalHeight-n)/2,n,n,0,0,192,192);
      try{
        localStorage.setItem(LS+'avatar',c.toDataURL('image/jpeg',.85));
        const hc=document.createElement('canvas');hc.width=840;hc.height=600;
        const sc=Math.max(840/im.naturalWidth,600/im.naturalHeight),w=im.naturalWidth*sc,h=im.naturalHeight*sc;
        hc.getContext('2d').drawImage(im,0,(600-h)*.25,w,h);
        try{localStorage.setItem(LS+'herobg',hc.toDataURL('image/jpeg',.76));}catch(e2){localStorage.removeItem(LS+'herobg');}
        toast('عکس تغییر کرد');
      }catch(e){toast('ذخیره‌ی عکس ممکن نشد');}
      URL.revokeObjectURL(u);setAvatar();t.value='';};
    im.onerror=()=>{URL.revokeObjectURL(u);toast('این فایل عکس معتبر نیست');};
    im.src=u;
  }
};

/* ---------- sheets ---------- */
function openGoalSheet(id){
  const g=id?G().find(x=>x.id===id):null,m=g&&g.metric,e=g&&g.effort;
  SH={id:id||null};
  const hab=g?g.habits||[]:[];
  openSheet(g?'ویرایش هدف':'هدف کلان تازه',
   `<label class="lb" for="gs-t">عنوان هدف</label><input id="gs-t" class="in" value="${esc(g&&!g.sample?g.t:g?g.t.replace(/^نمونه:\s*/,''):'')}" placeholder="مثلاً: رسیدن به وزن ۶۸ کیلوگرم">
    <label class="lb" for="gs-y">سال (شمسی)</label><input id="gs-y" class="in" inputmode="numeric" value="${fa(g?g.y:GY)}">
    <label class="lb">بخش‌های اندازه‌گیری</label>
    <div class="chips"><button class="chip ${m?'on':''}" data-a="gm" data-t="gs-mb">معیار موفقیت</button><button class="chip ${e?'on':''}" data-a="gm" data-t="gs-eb">تلاش‌ها</button></div>
    <div id="gs-mb" ${m?'':'hidden'}><label class="lb" for="gs-mn">نام معیار</label><input id="gs-mn" class="in" value="${esc(m?m.name:'')}" placeholder="مثلاً: وزن">
      <div class="two"><div><label class="lb" for="gs-mu">واحد</label><input id="gs-mu" class="in" value="${esc(m?m.unit:'')}" placeholder="کیلوگرم"></div><div><label class="lb" for="gs-ms">مقدار شروع</label><input id="gs-ms" class="in" inputmode="decimal" value="${m?fx(num(m.start)):''}"></div></div>
      <label class="lb" for="gs-mt">مقدار هدف</label><input id="gs-mt" class="in" inputmode="decimal" value="${m?fx(num(m.target)):''}"></div>
    <div id="gs-eb" ${e?'':'hidden'}><div class="two"><div><label class="lb" for="gs-eu">واحد تلاش</label><input id="gs-eu" class="in" value="${esc(e?e.unit:'')}" placeholder="ساعت"></div><div><label class="lb" for="gs-et">هدف تلاش سالانه</label><input id="gs-et" class="in" inputmode="decimal" value="${e?fx(num(e.target)):''}" placeholder="۱۰۰"></div></div>
      <label class="lb" for="gs-ep">هر بار انجام عادت‌های مرتبط چند واحد حساب شود؟</label><input id="gs-ep" class="in" inputmode="decimal" value="${e?fx(num(e.per)||1):'۱'}">
      <label class="lb">عادت‌های مرتبط (قدم‌های صبحگاهی)</label><div class="chips">${S.cfg.steps.map(s=>`<button class="chip ${hab.includes(s.id)?'on':''}" data-a="ghab" data-id="${s.id}">${esc(s.e)} ${esc(s.t)}</button>`).join('')}</div></div>`,
   `<button class="btn" data-a="gsave">ذخیره</button><button class="btn ghost" data-a="sclose">انصراف</button>`);
}
function saveGoalSheet(){
  const t=$('#gs-t').value.trim(),y=parseInt(en($('#gs-y').value),10);
  if(!t){toast('عنوان هدف را بنویس');return;}
  if(!(y>=1300&&y<=1600)){toast('سال را درست وارد کن، مثل ۱۴۰۵');return;}
  const old=SH.id?G().find(x=>x.id===SH.id):null;
  let metric=null,effort=null;
  if(!$('#gs-mb').hidden){
    const name=$('#gs-mn').value.trim(),unit=$('#gs-mu').value.trim(),st=en($('#gs-ms').value),tg=en($('#gs-mt').value);
    if(!name||st===''||tg===''||!isFinite(parseFloat(st))||!isFinite(parseFloat(tg))){toast('نام، شروع و هدف معیار را کامل کن');return;}
    if(parseFloat(st)===parseFloat(tg)){toast('مقدار شروع و هدف نباید برابر باشد');return;}
    const keep=old&&old.metric;
    metric={name,unit,start:parseFloat(st),target:parseFloat(tg),cur:keep?num(keep.cur):parseFloat(st),log:keep?keep.log||[]:[]};
    if(keep&&num(keep.start)!==parseFloat(st)&&!(metric.log||[]).length)metric.cur=parseFloat(st);
  }
  if(!$('#gs-eb').hidden){
    const unit=$('#gs-eu').value.trim(),tg=num(en($('#gs-et').value)),per=num(en($('#gs-ep').value))||1;
    if(!unit||tg<=0){toast('واحد و هدف تلاش را وارد کن');return;}
    effort={unit,target:tg,per};
  }
  const habits=[...document.querySelectorAll('#pn [data-a=ghab].on')].map(b=>b.dataset.id);
  if(old){Object.assign(old,{t,y,metric,effort,habits:effort?habits:[],sample:false});}
  else G().push({id:uid(),t,y,sample:false,metric,effort,actions:[],efforts:[],habits:effort?habits:[]});
  GY=y;saveGoals();closeSheet();render();
}

/* ---------- full screen: hides the browser bars when the app runs from a browser shortcut ---------- */
const isStandalone=()=>{try{return !!((window.matchMedia&&(matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches))||navigator.standalone===true);}catch(e){return false;}};
const canFS=!!(document.documentElement.requestFullscreen&&document.fullscreenEnabled)&&!isStandalone();
let fsPref=true,fsAuto=true;
try{fsPref=localStorage.getItem(LS+'fs')!=='0';}catch(e){}
function fsOn(){try{const p=document.documentElement.requestFullscreen({navigationUI:'hide'});if(p&&p.catch)p.catch(function(){});}catch(e){}}
function fsOff(){try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}}
document.addEventListener('click',()=>{if(!fsAuto||locked)return;fsAuto=false;if(canFS&&fsPref&&!document.fullscreenElement)fsOn();},true);
/* ---------- phone back button: close the top layer first, leave the app only from the home page ---------- */
let trapOn=!!(history.state&&history.state.mvt),exitT=0;
function backStep(){
  if(locked)return false;
  if(sheetOpen()){closeSheet();return true;}
  if(tab==='set'){tab=prevTab;render();window.scrollTo(0,0);return true;}
  if(tab==='goals'){if(openGoal){openGoal=null;render();return true;}tab='day';render();window.scrollTo(0,0);return true;}
  if(tab==='day'&&SEC.day){SEC.day='';render();window.scrollTo(0,0);return true;}
  return false;
}
/* one extra history entry sits above the app's first entry; pressing back lands on the first entry and we answer */
function ensureTrap(){if(trapOn)return;try{history.pushState({mvt:1},'');trapOn=true;}catch(e){}}
window.addEventListener('popstate',e=>{
  if(!trapOn||(e.state&&e.state.mvt))return;
  trapOn=false;
  if(backStep()){ensureTrap();return;}
  toast('برای خروج از برنامه، یک بار دیگر بازگشت را بزن');
  clearTimeout(exitT);exitT=setTimeout(ensureTrap,2600);
});
document.addEventListener('click',ensureTrap,true);
document.addEventListener('fullscreenchange',()=>{if(tab==='set'&&!sheetOpen())render();});

/* ---------- events ---------- */
const armed=new WeakMap();
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const f=A[el.dataset.a];if(!f)return;
  if(el.dataset.k&&!el.classList.contains('arm')){
    el.classList.add('arm');const html=el.innerHTML;armed.set(el,html);
    if(el.classList.contains('ib'))el.setAttribute('aria-label','تأیید حذف');else el.textContent='تأیید؟';
    setTimeout(()=>{if(el.isConnected&&armed.has(el)){el.classList.remove('arm');el.innerHTML=armed.get(el);armed.delete(el);}},3000);
    return;
  }
  f(el,e);
});
document.addEventListener('input',e=>{
  const t=e.target,b=t.dataset&&t.dataset.b;if(!b)return;
  const d=D(PK);
  if(/^g\d$/.test(b))d.g[+b[1]]=t.value;else if(b.slice(0,2)==='n:'){(d.notes||(d.notes={}))[b.slice(2)]=t.value;}else d[b]=t.value;
  touch(PK);
  if(autoTick()){const id=t.id,s=t.selectionStart,en2=t.selectionEnd;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(s,en2);}catch(x){}}}
});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset&&t.dataset.c;if(c&&CH[c])CH[c](t);});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;if(id==='nt'){e.preventDefault();A.tadd();}else if(id==='nr'){e.preventDefault();A.radd();}else if(id==='wt'){e.preventDefault();A.wadd();}else if(id==='wl'){e.preventDefault();A.ladd();}else if(id==='lk-pin'){e.preventDefault();A.lkpin();}});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='lk-pin')lkDots();});
document.addEventListener('keydown',e=>{
  if(!locked||$('#lk-pn').hidden||e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target,onBtn=!!(t&&t.closest&&t.closest('button'));if(t&&t.id==='lk-pin')return;
  if(/^[0-9]$/.test(e.key)){A.lkkey({dataset:{n:e.key}});}
  else if(e.key==='Backspace'){e.preventDefault();A.lkdel();}
  else if(e.key==='Enter'&&!onBtn){e.preventDefault();A.lkpin();}
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){flush();hideAt=Date.now();}
  else if(lockOn()&&!locked&&hideAt&&Date.now()-hideAt>LOCK_AFTER){lockNow();setTimeout(()=>{bioUnlock();},BIO_DELAY);}
});
